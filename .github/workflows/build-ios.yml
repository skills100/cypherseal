name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Website address, including folder"
        required: true
        default: "ndlapprenticeschool.com/CYPHER"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: native/package.json

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned IPA and AltStore source
        run: bash native/build-ios-ipa.sh "${{ inputs.site_url }}"

      - name: Verify generated files
        run: |
          test -s downloads/CipherSeal.ipa
          test -s downloads/altstore.json
          node -e "const j=require('./downloads/altstore.json'); if (!j.apps || !j.apps.length) process.exit(1); console.log('AltStore JSON is valid')"

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CipherSeal-ios
          path: |
            downloads/CipherSeal.ipa
            downloads/altstore.json
          if-no-files-found: error
          retention-days: 14
