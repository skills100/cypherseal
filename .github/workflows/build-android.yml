name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Website address, including folder"
        required: true
        default: "ndlapprenticeschool.com/CYPHER"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: native/package.json

      - name: Accept Android SDK licenses (SDK is preinstalled on this runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Generate Android project
        run: bash native/setup-android.sh "${{ inputs.site_url }}"

      - name: Build APK
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Prepare download file
        run: |
          mkdir -p downloads
          cp native/android/app/build/outputs/apk/debug/app-debug.apk downloads/CipherSeal.apk
          test -s downloads/CipherSeal.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CipherSeal-android-apk
          path: downloads/CipherSeal.apk
          if-no-files-found: error
          retention-days: 14
